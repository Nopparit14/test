name: Build unsigned IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: OGIOS
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: OGIOS
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.apple.mobile.MobileHouseArrest' }}
      PROJECT_NAME: ${{ inputs.project_name || 'OGIOS' }}
      INPUT_SCHEME: ${{ inputs.scheme || 'OGIOS' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Xcode project
        id: locate
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo 'No .xcodeproj or .xcworkspace found in the repository.' >&2
            exit 1
          fi
          if [ -n "$INPUT_SCHEME" ]; then
            SCHEME="$INPUT_SCHEME"
          elif [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or [""])[0])')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')
          fi
          [ -n "$SCHEME" ] || { echo 'No Xcode scheme found.' >&2; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned archive
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"
          else
            xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP_PATH" ] || { echo 'No .app was produced by xcodebuild.' >&2; exit 1; }
          
          # Move patches if exists
          PATCH_DIR="$APP_PATH/Patches"
          mkdir -p "$PATCH_DIR"
          for package in "$APP_PATH"/*.3105; do
            [ -e "$package" ] || continue
            mv "$package" "$PATCH_DIR/"
          done
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable OGIOS" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP_PATH/Info.plist" || true

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/${PROJECT_NAME}.ipa"
          test -s "$RUNNER_TEMP/${PROJECT_NAME}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ env.PROJECT_NAME }}.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "OGIOS Latest Build (Auto-Release)"
          body: |
            Automated IPA build from commit `${{ github.sha }}`.
            - Scheme: `${{ steps.locate.outputs.scheme }}`
            - Bundle ID: `${{ env.BUNDLE_ID }}`
          files: ${{ runner.temp }}/${{ env.PROJECT_NAME }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build summary
        if: always()
        run: |
          {
            echo "### IPA Build Completed"
            echo "Project: $PROJECT_NAME"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Scheme: ${{ steps.locate.outputs.scheme }}"
            echo "Signing: disabled (unsigned IPA)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/App.xcarchive"

